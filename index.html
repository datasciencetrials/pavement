        <style>
                html, body, #root { height: 100%; margin: 0; }
                body { overflow: hidden; background: #020617; }
                /* This is a public data-view platform. Keep the compatibility session
                   internal and remove account actions from the public interface. */
                .npms-user-badge, .npms-logout { display: none !important; }
                /* Below the app-shell's intended desktop breakpoint (and at high browser
                   zoom, which shrinks the same CSS-pixel viewport), the fixed 100%-height
                   flex layout can't guarantee every internal panel fits inside its own
                   overflow:auto container — the mobile browser's dynamic viewport height
                   alone makes that unreliable. Locking `overflow:hidden` on <body> then
                   traps that content: no scrollbar appears anywhere, so it's simply
                   unreachable. Below that width, fall back to normal document flow and
                   let the body itself scroll vertically; still block horizontal bleed. */
                @media (max-width: 900px) {
                          html, body, #root { height: auto; min-height: 100%; }
                          body { overflow-x: hidden; overflow-y: auto; }
                          /* Keep the condition map and its analytical pane usable together.
                             The compiled view uses inline desktop flex styles, so these
                             scoped overrides stack only the 340 px condition pane below
                             its map instead of covering almost the full mobile viewport. */
                          .npms-main > div[style*="flex-direction: column"] > div[style*="flex: 1 1 0%"][style*="display: flex"] {
                            flex-direction: column !important;
                          }
                          .npms-main > div[style*="flex-direction: column"] > div[style*="flex: 1 1 0%"][style*="display: flex"] > div:first-child {
                            flex: 1 1 58% !important;
                            min-height: 0 !important;
                          }
                          .npms-main aside[style*="width: 340px"] {
                            width: 100% !important;
                            height: 42% !important;
                            min-height: 280px;
                            border-left: 0 !important;
                            border-top: 1px solid rgba(99, 102, 241, 0.2);
                          }
                }
              </style>
